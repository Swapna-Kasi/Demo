<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Left Input Fields</h1>
    <form>
        <label for="percent">Select Percentage:</label>
        <input type="range" value="0" step="7" />
        <br><br>
        <label for="partyTime">partyTime Schedule:</label>
        <input type="datetime-local" name="partyTime" id="partyTime" />
        <br><br>
        <label for="week">Select Week:</label>
        <input type="week" id="week" name="week" />
        <br><br>
        <label for="color">Select Color:</label>
        <input type="color" name="" id="color" />
        <br><br>
        <label for="">Select Technical Skills:</label>
        <input type="checkbox" name="" id="data">
        <label for="data">Data</label>
        <input type="checkbox" name="" id="library" />
        <label for="library">library</label>
        <input type="checkbox" name="" id="collection" checked/>
        <label for="collection">collection</label>
        <input type="checkbox" name="" id="frameworks" />
        <label for="frameworks">frameworks</label>
        <input type="checkbox" name="" id="packages" />
        <label for="packages">packages</label>
        <br><br>
        <label for="aadhar">Aadhar Number</label>
        <input type="text"
        name="Aadhar Card"
        id="aadhar"
        value="8484 4926 2222"
        readonly />
        <br><br>
         <label for="pan">Pan Number</label>
        <input type="text"
        name="Pan Card"
        id="pan"
        value="AZ1345NM"
        disabled />
        <br />
        <br />
        <button type="submit">Submit</button>
        <input type="reset" value="reset form" />
        <input type="button" value="normal button" />
        <input type="submit" value="submit button" />

    </form>
    <br><br>
    <button>Submit</button>
</body>
</html>
